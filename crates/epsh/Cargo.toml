[package]
name = "epsh"
version = "0.0.9"
edition = "2024"
description = "embeddable posix shell"
license = "MIT"
repository = "https://github.com/joshuarli/ish"
readme = "README.md"
keywords = ["shell", "posix", "embedded", "scripting"]
categories = ["command-line-utilities", "os::unix-apis"]
exclude = ["tests/stress/"]

[lib]
name = "epsh"
path = "src/lib.rs"

[[bin]]
name = "epsh"
path = "src/main.rs"

[dependencies]
libc = "0.2"
fxhash = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "system", "termios", "time"] }

[dev-dependencies]
tempfile = "3"
regex-lite = "0.1.9"

