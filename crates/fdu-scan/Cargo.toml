[package]
name = "fdu-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only filesystem scanning for fdu"

[dependencies]
fdu-posix = { path = "../fdu-posix" }
fdu-core = { path = "../fdu-core" }
crossbeam-deque = "0.8"
hashbrown = { workspace = true }
rustix = { version = "1.1", features = ["fs", "process", "std", "time", "linux_latest"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

