name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            docker_platform: ''
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker_platform: linux/amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            docker_platform: linux/arm64

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: matrix.docker_platform != ''
      - name: Build Linux release image
        if: matrix.docker_platform != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.docker_platform }}
          load: true
          tags: ish-builder:${{ matrix.target }}
          cache-from: type=gha,scope=ish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ish-${{ matrix.target }}
      - uses: laputa-systems/setup-rust@a7d09bfe692e431e6a98cd107ac2df77d47b5bba
        if: matrix.docker_platform == ''
      - name: Build macOS release
        if: matrix.docker_platform == ''
        run: make release TARGET="${{ matrix.target }}"
      - name: Run macOS tests
        if: matrix.docker_platform == ''
        env:
          RUST_TEST_THREADS: 1
        run: make test-ci TARGET="${{ matrix.target }}"
      - name: Save macOS release
        if: matrix.docker_platform == ''
        run: cp "target/${{ matrix.target }}/release/ish" "ish-${{ matrix.target }}"
      - name: Build and verify Linux releases
        if: matrix.docker_platform != ''
        run: |
          docker run --rm --init \
            --platform "${{ matrix.docker_platform }}" \
            -v "$GITHUB_WORKSPACE:/ish" \
            -w /ish \
            ish-builder:${{ matrix.target }} \
            sh -ec '
              make release-pgo-linux TARGET=${{ matrix.target }}
              make verify-release-dynamic TARGET=${{ matrix.target }}
              make test-ci TARGET=${{ matrix.target }}
              cp target/${{ matrix.target }}/release/ish ish-${{ matrix.target }}
              make release-pgo-linux-static TARGET=${{ matrix.target }}
              make verify-release TARGET=${{ matrix.target }}
              cp target/${{ matrix.target }}/release/ish ish-${{ matrix.target }}-static
            '
      - uses: actions/upload-artifact@v4
        with:
          name: ish-${{ matrix.target }}
          path: ish-*

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ish-*
          path: dist
          merge-multiple: true
      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TAG"
