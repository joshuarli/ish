[package]
name = "ish"
version = "0.0.0"
edition = "2024"

[workspace]
members = [".", "crates/epsh"]
default-members = [".", "crates/epsh"]

[dependencies]
epsh = { version = "0.0.9", path = "crates/epsh" }
fxhash = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "system", "termios", "time"] }
libc = "0.2"

[dev-dependencies]
rustybench = "0.3"
laputa-ptytest = "0.2"
serde_json = "1"

[[bench]]
name = "bench"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
