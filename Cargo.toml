[package]
name = "ish"
version = "0.0.0"
edition = "2024"

[workspace]
members = ["crates/ish-undo"]
default-members = [".", "crates/ish-undo"]

[dependencies]
epsh = { path = "../epsh" }
ish-undo = { path = "crates/ish-undo" }
fxhash = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "runtime", "system", "termios", "time"] }
libc = "0.2"

[dev-dependencies]
rustybench = { path = "../rustybench" }
laputa-ptytest = { path = "../ptytest" }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "undo"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
