[package]
name = "ish"
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace]
exclude = ["vendor/fz"]
members = [
    ".",
    "crates/epsh",
    "crates/fdu-core",
    "crates/fdu-posix",
    "crates/fdu-delete",
    "crates/fdu-scan",
    "crates/fdu-tui",
    "crates/ish-fs",
]
default-members = [".", "crates/epsh", "crates/fdu-delete", "crates/fdu-tui", "crates/ish-fs"]

[workspace.dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }

[dependencies]
epsh = { version = "0.0.9", path = "crates/epsh" }
fdu-core = { path = "crates/fdu-core" }
fdu-delete = { path = "crates/fdu-delete" }
fdu-posix = { path = "crates/fdu-posix" }
fdu-scan = { path = "crates/fdu-scan" }
fdu-tui = { path = "crates/fdu-tui" }
fz = { path = "vendor/fz" }
hashbrown = { workspace = true }
ish-fs = { path = "crates/ish-fs" }
rustc-hash = "2.1"
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "pty", "rand", "stdio", "system", "termios", "time"] }
libc = "0.2"

[dev-dependencies]
rustybench = "0.5"
laputa-ptytest = "0.4"
deser-json = "0.10.2"
deser-value = "0.10.2"

[[bench]]
name = "bench"
harness = false

[[test]]
name = "fs_bench"
path = "benches/fs/fs_bench.rs"

[[test]]
name = "fdu_pty"
path = "tests/fdu_pty.rs"

[[test]]
name = "fdu_snapshots"
path = "tests/fdu_snapshots.rs"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
