[package]
name = "ish"
version = "0.0.0"
edition = "2024"

[workspace]
members = ["crates/ish-undo"]
default-members = [".", "crates/ish-undo"]

[workspace.dependencies]
libc = "0.2"
rustix = "1.1.4"

[dependencies]
epsh = "0.0.9"
ish-undo = { path = "crates/ish-undo" }
fxhash = "0.2"
rustix = { workspace = true, features = ["event", "fs", "pipe", "process", "runtime", "system", "termios", "time"] }
libc.workspace = true

[dev-dependencies]
rustybench = "0.3"
laputa-ptytest = "0.2"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "undo"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
