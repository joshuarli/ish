[package]
name = "ish"
version = "0.0.0"
edition = "2024"

[workspace]
members = [
    ".",
    "crates/epsh",
    "crates/fdu-core",
    "crates/fdu-delete",
    "crates/fdu-scan",
    "crates/ish-fs",
]
default-members = [".", "crates/epsh", "crates/fdu-delete", "crates/ish-fs"]

[workspace.dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }

[dependencies]
epsh = { version = "0.0.9", path = "crates/epsh" }
fdu-core = { path = "crates/fdu-core" }
fdu-delete = { path = "crates/fdu-delete" }
fdu-scan = { path = "crates/fdu-scan" }
ish-fs = { path = "crates/ish-fs" }
fxhash = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "pty", "rand", "stdio", "system", "termios", "time"] }
libc = "0.2"

[dev-dependencies]
rustybench = "0.3"
laputa-ptytest = "0.2"
serde_json = "1"

[[bench]]
name = "bench"
harness = false

[[test]]
name = "fs_bench"
path = "benches/fs/fs_bench.rs"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
